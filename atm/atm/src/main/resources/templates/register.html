<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>ATM Management System</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h2 style="text-align:center">Register Account</h2>

    <form action="#" th:action="@{/registerAccount}" th:object="${registerInfo}"
          method="POST" class="d-grid gap-2 col-6 mx-auto">
            <div class="mb-3">
                <label for="formGroupInput" class="form-label">Account name</label>
                <input type="text" th:field="*{name}" class="form-control"
                       id="formGroupInput" placeholder="Enter your name" required>
            </div>
            <div class="mb-3">
                <label for="formGroupInput2" class="form-label">Password</label>
                <input type="password" th:field="*{password}" class="form-control"
                       id="formGroupInput2" placeholder="Enter your password" required>
            </div>
            <div class="mb-3">
                <label for="formGroupInput3" class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control"
                       id="formGroupInput3" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
                <label for="formGroupInput4" class="form-label">Address</label>
                <input type="text" th:field="*{address}" class="form-control"
                       id="formGroupInput4" placeholder="Enter your address" required>
            </div>


        <button type="submit" class="btn btn-outline-primary">Register</button>
    </form>

    <hr>

    <a th:href="@{/}" class="btn btn-primary" tabindex="-1" role="button">Home</a>
</div>
</body>
</html>
