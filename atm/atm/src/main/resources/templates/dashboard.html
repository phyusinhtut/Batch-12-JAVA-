<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<!--    <h3 th:text="${message}" style="text-align:center"></h3>-->
    <h3 style="text-align:center">Dashboard</h3>
    <hr>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4>Your Information</h4>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered table-hover mb-0">
                            <thead class="table-light">
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">UserName</th>
                                <th scope="col">Email</th>
                                <th scope="col">Balance</th>
                                <th scope="col">Address</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <th scope="row" th:text="${info.accountId}"></th>
                                <td th:text="${info.username}"></td>
                                <td th:text="${info.email}"></td>
                                <td th:text="${info.balance}"></td>
                                <td th:text="${info.address}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <h4>Our Services</h4>
        <hr>
    <!--    Deposit-->
        <form class="row g-3"  th:action="@{/dashboardDeposit}" method="POST"
              style="margin-top:20px">
            <div class="col-4">
               <p>Deposit Money</p>
            </div>
            <div class="col-auto">
                <input type="number" th:field="${serviceInfo.amount}" class="form-control" placeholder="Amount">
            </div>
            <div class="col-2">
                <button type="submit" class="btn btn-primary mb-3">Deposit</button>
            </div>
        </form>
        <form class="row g-3" th:action="@{/dashboardWithdraw}" method="POST"
              style="margin-top:20px margin-left:50px">
            <div class="col-4">
                <p>Withdraw Money</p>
            </div>
            <div class="col-auto">
                <input type="number" th:field="${serviceInfo.amount}" class="form-control" placeholder="Amount">
            </div>
            <div class="col-2">
                <button type="submit" class="btn btn-primary mb-3">Withdraw</button>
            </div>
        </form>
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
            <strong th:text="${message}" style="text-align:center"></strong>
        </div>

    <!--    <a th:href="@{/}"> Home</a>-->
    <!--    <a th:href="@{/history}"> History</a>-->
        <a th:href="@{/}" class="btn btn-primary" tabindex="-1" role="button">Home</a>
        <a th:href="@{/history}" class="btn btn-secondary" tabindex="-1" role="button">History</a>
    </div>
</body>
</html>
